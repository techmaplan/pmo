<!DOCTYPE html>
<html lang="pl">
<head>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROJEKTY — PANEL GŁÓWNY</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--black:#0a0a0a;--white:#fff;--g1:#f2f2f0;--g2:#e0dfdc;--g3:#c8c7c3;--g4:#9e9d99;--g6:#5a5955;--g8:#2a2a28}
body{font-family:'Barlow',sans-serif;background:var(--g1);color:var(--black);min-height:100vh;display:flex;flex-direction:column}

.site-header{background:var(--black);padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:72px;border-bottom:2px solid #222;flex-shrink:0}
.header-left{display:flex;flex-direction:column;gap:2px}
.header-title{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;color:var(--white);letter-spacing:.04em;text-transform:uppercase}
.header-sub{font-size:11px;color:var(--g4);letter-spacing:.1em;text-transform:uppercase}
.header-right{display:flex;align-items:center;gap:10px}

.toolbar{padding:16px 32px 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.toolbar button{font-family:'Barlow',sans-serif;font-size:11px;font-weight:600;padding:4px 14px;cursor:pointer;border:1px solid #d0ccc8;background:#fff;color:#333;box-shadow:0 1px 3px rgba(0,0,0,.10);border-radius:4px;transition:background .12s,box-shadow .12s;letter-spacing:.04em;text-transform:uppercase;height:29px;display:inline-flex;align-items:center;gap:5px}
.toolbar button:hover{background:#f5f3f0;box-shadow:0 2px 6px rgba(0,0,0,.13)}
.toolbar .btn-add{background:var(--black);color:#fff;border-color:var(--black)}
.toolbar .btn-add:hover{background:var(--g8)}
.toolbar button:disabled{opacity:.35;cursor:not-allowed;pointer-events:none}
.col-sep{width:1px;height:20px;background:var(--g3)}

.filter-bar{padding:10px 32px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.filter-label{font-size:10px;font-weight:700;color:var(--g4);letter-spacing:.1em;text-transform:uppercase;margin-right:2px}
.filter-btn{font-family:'Barlow',sans-serif;font-size:10px;font-weight:600;padding:2px 10px;cursor:pointer;border:1px solid var(--g3);background:transparent;color:var(--g6);border-radius:3px;transition:all .12s;letter-spacing:.04em;text-transform:uppercase;height:22px}
.filter-btn:hover,.filter-btn.active{background:var(--black);color:#fff;border-color:var(--black)}

.page{padding:16px 32px 32px;flex:1}

.stats-row{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.stat-card{background:#fff;border:1px solid var(--g2);padding:10px 18px;min-width:120px}
.stat-val{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:700;color:var(--black);line-height:1}
.stat-label{font-size:9px;font-weight:700;color:var(--g4);letter-spacing:.1em;text-transform:uppercase;margin-top:3px}

.projects-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}

.project-card{background:#fff;border:1px solid var(--g2);transition:box-shadow .15s,border-color .15s;position:relative;display:flex;flex-direction:column}
.project-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.10);border-color:var(--g3)}
.project-card.active .card-accent{background:#27ae60}
.project-card.paused .card-accent{background:#e67e22}
.project-card.done .card-accent{background:var(--g4)}
.project-card.planned .card-accent{background:#2980b9}
.card-accent{width:100%;height:3px;flex-shrink:0}
.card-body{padding:10px 12px;flex:1;display:flex;flex-direction:column}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;margin-bottom:4px}
.card-num{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;color:var(--g4);letter-spacing:.1em;text-transform:uppercase}
.card-status{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:1px 6px;border-radius:2px}
.status-active{background:#e8f8ee;color:#1a7a40}
.status-paused{background:#fef3e8;color:#b85c00}
.status-done{background:var(--g1);color:var(--g6)}
.status-planned{background:#eef4fb;color:#1a5080}
.card-name{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;color:var(--black);line-height:1.2;text-transform:uppercase;letter-spacing:.02em;margin-bottom:4px}
.card-desc{font-size:11px;color:var(--g6);line-height:1.4;margin-bottom:6px;flex:1}
.card-meta{display:flex;align-items:center;gap:8px;border-top:1px solid var(--g1);padding-top:6px}
.meta-item{display:flex;flex-direction:column;gap:1px}
.meta-val{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;color:var(--g8)}
.meta-key{font-size:8px;font-weight:700;color:var(--g4);letter-spacing:.08em;text-transform:uppercase}
.meta-sep{width:1px;height:22px;background:var(--g2)}
.card-progress{margin-top:6px}
.progress-label{display:flex;justify-content:space-between;margin-bottom:3px}
.progress-text{font-size:8px;font-weight:700;color:var(--g4);letter-spacing:.08em;text-transform:uppercase}
.progress-pct{font-size:8px;font-weight:700;color:var(--g8)}
.progress-track{height:2px;background:var(--g2)}
.progress-fill{height:100%;background:var(--black);transition:width .3s ease}
.project-card.active .progress-fill{background:#27ae60}
.project-card.paused .progress-fill{background:#e67e22}
.card-actions{padding:6px 12px;border-top:1px solid var(--g1);display:flex;gap:5px;background:var(--g1)}
.archive-card{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 12px;background:var(--white);border:1px solid var(--g2);border-radius:4px}
.archive-card-num{font-size:10px;color:var(--g5);font-weight:600;letter-spacing:.04em}
.archive-card-name{font-size:13px;font-weight:600;color:var(--g7)}
.archive-card-date{font-size:10px;color:var(--g4);margin-top:1px}
.archive-card-actions{display:flex;gap:6px;flex-shrink:0}
.archive-restore-btn{font-family:'Barlow',sans-serif;font-size:11px;font-weight:600;padding:4px 10px;border:1px solid #27ae60;background:#f0faf4;color:#1a7a40;border-radius:3px;cursor:pointer}
.archive-restore-btn:hover{background:#27ae60;color:#fff}
.archive-del-btn{font-family:'Barlow',sans-serif;font-size:11px;font-weight:600;padding:4px 10px;border:1px solid var(--g3);background:none;color:var(--g5);border-radius:3px;cursor:pointer}
.archive-del-btn:hover{background:#fde8e8;border-color:#c0392b;color:#c0392b}
.action-btn{font-family:'Barlow',sans-serif;font-size:10px;font-weight:600;padding:2px 8px;cursor:pointer;border:1px solid #d0ccc8;background:#fff;color:#444;border-radius:3px;transition:all .12s;letter-spacing:.04em;text-transform:uppercase;height:22px;display:inline-flex;align-items:center;gap:4px}
.action-btn:hover{background:#f5f3f0;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.action-btn.primary{background:var(--black);color:#fff;border-color:var(--black)}
.action-btn.primary:hover{background:var(--g8)}

.phase-tooltip{position:fixed;background:#0a0a0a;color:#fff;border:1px solid #333;padding:12px 14px;z-index:9999;pointer-events:none;opacity:0;transition:opacity .15s;min-width:220px;max-width:280px;font-family:'Barlow',sans-serif}
.phase-tooltip.visible{opacity:1}
.pt-title{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#9e9d99;margin-bottom:8px}
.pt-row{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.pt-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.pt-label{font-size:11px;font-weight:600;color:#fff;flex:1}
.pt-dates{font-size:10px;color:#9e9d99;white-space:nowrap}
.pt-nodata{font-size:11px;color:#9e9d99;font-style:italic}
.card-editor{font-size:9px;color:var(--g4);letter-spacing:.04em;margin-top:3px;display:flex;align-items:center;gap:5px}
.editor-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.activity-section{padding:0 32px 40px}
.activity-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid var(--black)}
.activity-title{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.activity-list{display:flex;flex-direction:column;gap:1px}
.activity-row{display:flex;align-items:center;gap:12px;padding:8px 12px;background:#fff;border:1px solid var(--g2)}
.activity-row:hover{background:var(--g1)}
.act-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0}
.act-info{flex:1;min-width:0}
.act-project{font-size:11px;font-weight:700;color:var(--black);text-transform:uppercase;letter-spacing:.04em}
.act-email{font-size:10px;color:var(--g6)}
.act-time{font-size:10px;color:var(--g4);white-space:nowrap}
.activity-empty{padding:20px;text-align:center;font-size:11px;color:var(--g4);background:#fff;border:1px solid var(--g2)}
.project-card[draggable]{cursor:grab}
.project-card[draggable]:active{cursor:grabbing}
.project-card.drag-over{outline:2px dashed var(--g4);outline-offset:-2px;opacity:.6}
.project-card.dragging{opacity:.35}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:500;display:none;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#fff;border:2px solid var(--black);padding:28px;width:420px;max-width:95vw;box-shadow:6px 6px 0 var(--black)}
.modal h3{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:20px}
.field{margin-bottom:14px}
.field label{font-size:10px;font-weight:700;color:var(--g6);text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:7px 10px;font-size:13px;font-family:'Barlow',sans-serif;border:1.5px solid var(--g3);background:#fff;color:var(--black);outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--black)}
.field textarea{min-height:60px;resize:vertical;line-height:1.5}
.field-row{display:flex;gap:10px}
.field-row .field{flex:1}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--g2)}
.modal-actions button{font-family:'Barlow',sans-serif;font-size:11px;font-weight:700;padding:6px 18px;cursor:pointer;border:1.5px solid var(--black);letter-spacing:.04em;text-transform:uppercase;height:32px;display:inline-flex;align-items:center}
.modal-actions .btn-save{background:var(--black);color:#fff}
.modal-actions .btn-save:hover{background:var(--g8)}
.modal-actions .btn-cancel{background:#fff;color:var(--black)}
.modal-actions .btn-cancel:hover{background:var(--g1)}
.btn-del{margin-right:auto;background:#fff;color:#7a5010;border-color:#e8a020}
.btn-del:hover{background:#e8a020;color:#fff}

.empty-state{padding:64px 32px;text-align:center;grid-column:1/-1}
.empty-state .es-icon{font-size:40px;margin-bottom:16px}
.empty-state .es-title{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--g3);margin-bottom:8px}
.empty-state .es-sub{font-size:12px;color:var(--g4)}

.search-wrap{position:relative;flex:1;max-width:280px}
.search-wrap input{width:100%;padding:5px 10px 5px 30px;font-size:12px;font-family:'Barlow',sans-serif;border:1px solid var(--g3);background:#fff;color:var(--black);outline:none;height:29px}
.search-wrap input:focus{border-color:var(--black)}
.search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--g4);font-size:12px;pointer-events:none}
</style>
</head>
<body>

<header class="site-header">
  <div class="header-left">
    <div class="header-title">Panel projektów</div>
    <div class="header-sub">Zarządzanie harmonogramami</div>
  </div>
  <div class="header-right">
    <div id="user-info" style="display:none;align-items:center;gap:10px">
      <span id="user-email" style="font-size:11px;color:var(--g4);letter-spacing:.06em"></span>
      <div id="presence-bar" style="display:flex;align-items:center;gap:4px"></div>
      <button onclick="openChangePassword()" style="font-family:'Barlow',sans-serif;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 12px;cursor:pointer;border:1px solid rgba(255,255,255,.2);background:transparent;color:var(--g4);border-radius:3px;height:24px">Zmień hasło</button>
      <button onclick="sbSignOut()" style="font-family:'Barlow',sans-serif;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 12px;cursor:pointer;border:1px solid rgba(255,255,255,.2);background:transparent;color:var(--g4);border-radius:3px;height:24px">Wyloguj</button>
    </div>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" placeholder="Szukaj projektu…" id="search-input" oninput="filterProjects()">
    </div>
  </div>
</header>

<!-- LOGIN SCREEN -->
<div id="login-screen" style="position:fixed;inset:0;background:var(--g1);z-index:1000;display:flex;align-items:center;justify-content:center">
  <div style="background:#fff;border:2px solid var(--black);padding:40px;width:360px;max-width:95vw;box-shadow:6px 6px 0 var(--black)">
    <div style="font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px">Panel projektów</div>
    <div style="font-size:11px;color:var(--g4);letter-spacing:.1em;text-transform:uppercase;margin-bottom:28px">Zaloguj się aby kontynuować</div>
    <div style="margin-bottom:14px">
      <label style="font-size:10px;font-weight:700;color:var(--g6);text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:4px">Email</label>
      <input id="login-email" type="email" placeholder="twoj@email.com" style="width:100%;padding:8px 10px;font-size:13px;font-family:'Barlow',sans-serif;border:1.5px solid var(--g3);outline:none;background:#fff" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div style="margin-bottom:8px">
      <label style="font-size:10px;font-weight:700;color:var(--g6);text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:4px">Hasło</label>
      <input id="login-password" type="password" placeholder="••••••••" style="width:100%;padding:8px 10px;font-size:13px;font-family:'Barlow',sans-serif;border:1.5px solid var(--g3);outline:none;background:#fff" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div style="margin-bottom:20px;text-align:right">
      <button onclick="openForgotPassword()" style="font-family:'Barlow',sans-serif;font-size:10px;font-weight:600;color:var(--g4);background:none;border:none;cursor:pointer;letter-spacing:.04em;padding:0;text-decoration:underline">Zapomniałem hasła</button>
    </div>
    <div id="login-error" style="font-size:11px;color:#c0392b;margin-bottom:12px;display:none"></div>
    <button id="login-btn" onclick="doLogin()" style="width:100%;font-family:'Barlow',sans-serif;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:10px;cursor:pointer;border:1.5px solid var(--black);background:var(--black);color:#fff;height:40px">Zaloguj</button>
  </div>
</div>

<!-- RESET HASŁA MODAL -->
<div id="forgot-modal" style="position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1100;display:none;align-items:center;justify-content:center">
  <div style="background:#fff;border:2px solid var(--black);padding:32px;width:360px;max-width:95vw;box-shadow:6px 6px 0 var(--black)" onclick="event.stopPropagation()">
    <div style="font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:20px">Reset hasła</div>
    <div style="font-size:12px;color:var(--g6);margin-bottom:16px">Wpisz swój email — wyślemy link do zresetowania hasła.</div>
    <div style="margin-bottom:16px">
      <label style="font-size:10px;font-weight:700;color:var(--g6);text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:4px">Email</label>
      <input id="forgot-email" type="email" placeholder="twoj@email.com" style="width:100%;padding:8px 10px;font-size:13px;font-family:'Barlow',sans-serif;border:1.5px solid var(--g3);outline:none;background:#fff" onkeydown="if(event.key==='Enter')doForgotPassword()">
    </div>
    <div id="forgot-msg" style="font-size:11px;margin-bottom:12px;display:none"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button onclick="closeForgotPassword()" style="font-family:'Barlow',sans-serif;font-size:11px;font-weight:700;padding:6px 18px;cursor:pointer;border:1.5px solid var(--black);background:#fff;color:var(--black);letter-spacing:.04em;text-transform:uppercase;height:32px">Anuluj</button>
      <button id="forgot-btn" onclick="doForgotPassword()" style="font-family:'Barlow',sans-serif;font-size:11px;font-weight:700;padding:6px 18px;cursor:pointer;border:1.5px solid var(--black);background:var(--black);color:#fff;letter-spacing:.04em;text-transform:uppercase;height:32px">Wyślij link</button>
    </div>
  </div>
</div>

<!-- ZMIANA HASŁA MODAL -->
<div id="change-pwd-modal" style="position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1100;display:none;align-items:center;justify-content:center">
  <div style="background:#fff;border:2px solid var(--black);padding:32px;width:360px;max-width:95vw;box-shadow:6px 6px 0 var(--black)" onclick="event.stopPropagation()">
    <div style="font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:20px">Zmień hasło</div>
    <div style="margin-bottom:14px">
      <label style="font-size:10px;font-weight:700;color:var(--g6);text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:4px">Nowe hasło</label>
      <input id="new-password" type="password" placeholder="••••••••" style="width:100%;padding:8px 10px;font-size:13px;font-family:'Barlow',sans-serif;border:1.5px solid var(--g3);outline:none;background:#fff">
    </div>
    <div style="margin-bottom:20px">
      <label style="font-size:10px;font-weight:700;color:var(--g6);text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:4px">Powtórz hasło</label>
      <input id="new-password2" type="password" placeholder="••••••••" style="width:100%;padding:8px 10px;font-size:13px;font-family:'Barlow',sans-serif;border:1.5px solid var(--g3);outline:none;background:#fff">
    </div>
    <div id="change-pwd-msg" style="font-size:11px;margin-bottom:12px;display:none"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button onclick="closeChangePassword()" style="font-family:'Barlow',sans-serif;font-size:11px;font-weight:700;padding:6px 18px;cursor:pointer;border:1.5px solid var(--black);background:#fff;color:var(--black);letter-spacing:.04em;text-transform:uppercase;height:32px">Anuluj</button>
      <button id="change-pwd-btn" onclick="doChangePassword()" style="font-family:'Barlow',sans-serif;font-size:11px;font-weight:700;padding:6px 18px;cursor:pointer;border:1.5px solid var(--black);background:var(--black);color:#fff;letter-spacing:.04em;text-transform:uppercase;height:32px">Zapisz</button>
    </div>
  </div>
</div>

<div class="toolbar">
  <button class="btn-add" id="btn-new">＋ Nowy projekt</button>
  <div class="col-sep"></div>
  <button onclick="openZasoby()">👥 Zasoby</button>
  <div class="col-sep"></div>
  <button id="view-grid" onclick="setView('grid')">⊞ Kafelki</button>
  <button id="view-list" onclick="setView('list')">☰ Lista</button>
</div>

<div class="filter-bar">
  <span class="filter-label">Status:</span>
  <button class="filter-btn active" onclick="setFilter('all',this)">Wszystkie</button>
  <button class="filter-btn" onclick="setFilter('active',this)">Aktywne</button>
  <button class="filter-btn" onclick="setFilter('done',this)">Zakończone</button>
</div>

<div class="page">
  <div class="stats-row" id="stats-row"></div>
  <div class="projects-grid" id="projects-container"></div>

  <div style="margin-top:28px;border-top:1px solid var(--g2);padding-top:16px">
    <div style="display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none" onclick="toggleArchive()">
      <span id="archive-toggle-icon" style="font-size:11px;color:var(--g4)">▶</span>
      <span style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--g5)">Archiwum</span>
      <span id="archive-badge" style="font-size:10px;background:var(--g2);color:var(--g6);padding:1px 6px;border-radius:10px;font-weight:600"></span>
    </div>
    <div id="archive-section" data-open="0">
      <div id="archive-container" style="display:none;margin-top:10px;flex-direction:column;gap:6px"></div>
    </div>
  </div>
</div>

<!-- PHASE TOOLTIP -->
<div class="phase-tooltip" id="phase-tooltip"></div>

<!-- ACTIVITY SECTION -->
<div class="activity-section" id="activity-section" style="display:none">
  <div class="activity-header">

const SB_URL = 'https://qggsljbngjtlkzahapch.supabase.co';

// ── Auth ─────────────────────────────────────────────────────────────────────
let _authToken = null;
let _authUser  = null;

async function sbSignIn(email, password) {
  const res = await fetch(`${SB_URL}/auth/v1/token?grant_type=password`, {
    method: 'POST',
    headers: { 'apikey': SB_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password }),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error_description || data.msg || 'Błąd logowania');
  _authToken = data.access_token;
  _authUser  = data.user;
  sessionStorage.setItem('sb_token', _authToken);
  sessionStorage.setItem('sb_user',  JSON.stringify(_authUser));
  if (data.refresh_token) sessionStorage.setItem('sb_refresh_token', data.refresh_token);
  return data;
}

async function sbSignOut() {
  try {
    await fetch(`${SB_URL}/auth/v1/logout`, {
      method: 'POST',
      headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${_authToken}` },
    });
  } catch(e) {}
  _authToken = null; _authUser = null;
  sessionStorage.removeItem('sb_token');
  sessionStorage.removeItem('sb_user');
  // Pełne przeładowanie strony — najczystsze rozwiązanie
  window.location.reload();
}

async function sbRefreshToken(refreshToken) {
  const res = await fetch(`${SB_URL}/auth/v1/token?grant_type=refresh_token`, {
    method: 'POST',
    headers: { 'apikey': SB_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ refresh_token: refreshToken }),
  });
  if (!res.ok) return null;
  const data = await res.json();
  _authToken = data.access_token;
  sessionStorage.setItem('sb_token', _authToken);
  return data.access_token;
}

function sbHeaders() {
  return {
    'apikey': SB_KEY,
    'Authorization': `Bearer ${_authToken || SB_KEY}`,
    'Content-Type': 'application/json',
  };
}
async function sbGet(table, id) {
  const url = id
    ? `${SB_URL}/rest/v1/${table}?id=eq.${encodeURIComponent(id)}&limit=1`
    : `${SB_URL}/rest/v1/${table}?select=*`;
  const res = await fetch(url, { headers: sbHeaders() });
  if (!res.ok) return null;
  const rows = await res.json();
  return id ? (rows[0] || null) : rows;
}

async function sbUpsert(table, row) {
  const res = await fetch(`${SB_URL}/rest/v1/${table}`, {
    method: 'POST',
    headers: { ...sbHeaders(), 'Prefer': 'resolution=merge-duplicates' },
    body: JSON.stringify(row),
  });
  return res.ok;
}

async function sbDelete(table, id) {
  const res = await fetch(`${SB_URL}/rest/v1/${table}?id=eq.${encodeURIComponent(id)}`, {
    method: 'DELETE', headers: sbHeaders(),
  });
  return res.ok;
}

function sbHeaders() {
  return {
    'apikey': SB_KEY,
    'Authorization': `Bearer ${_authToken || SB_KEY}`,
    'Content-Type': 'application/json',
  };
}

// Realtime WebSocket
function sbRealtime(table, callback) {
  const ws = new WebSocket(`${SB_URL.replace('https','wss')}/realtime/v1/websocket?apikey=${SB_KEY}&vsn=1.0.0`);
  ws.onopen = () => {
    ws.send(JSON.stringify({ topic: `realtime:public:${table}`, event: 'phx_join', payload: {}, ref: '1' }));
  };
  ws.onmessage = e => {
    const msg = JSON.parse(e.data);
    if (msg.event === 'INSERT' || msg.event === 'UPDATE' || msg.event === 'DELETE') {
      callback(msg.event, msg.payload?.record);
    }
  };
  ws.onclose = () => setTimeout(() => sbRealtime(table, callback), 3000); // auto-reconnect
  return ws;
}

    (function(){
      var t = '${token}';
      var s = '${syncId}';
      if(t) sessionStorage.setItem('sb_token', t);

// ── Render ───────────────────────────────────────────────────────────────────
function statusLabel(s) {

function getFiltered() {

    const okSearch = !q || p.name.toLowerCase().includes(q) || (p.num||'').toLowerCase().includes(q) || (p.desc||'').toLowerCase().includes(q);

}

        <div class="card-meta">

          ${p.end   ? `<div class="meta-sep"></div><div class="meta-item"><div class="meta-val">${p.end.slice(0,7)}</div><div class="meta-key">Koniec</div></div>` : ''}

async function openSzablon() {
  showToast('Ładowanie szablonu…');
  let src;
  try {
    src = await fetchTemplate();
    saveTemplateCache(src);
  } catch(e) {
    // file:// fallback
    const input = document.createElement('input');
    input.type = 'file'; input.accept = '.html';
    input.onchange = e => {
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => { saveTemplateCache(ev.target.result); openSzablon(); };
      reader.readAsText(file);
    };
    input.click();
    showToast('Wybierz plik HARMONOGRAM_2026.html');
    return;
  }
  const inject = '<script>'
    + 'window.__PM_TEMPLATE_MODE__=true;'
    + 'document.addEventListener(\'DOMContentLoaded\',function(){'
    + 'var btn=document.querySelector(\'.save-btn\');'
    + 'if(btn){btn.title=\'Zapisz szablon\';btn.textContent=\'💾 Zapisz szablon\';}'
    + '});'
    + '<\/script>';
  openInTab(src.replace('</body>', inject + '\n</body>'));
}

// ── Modal ────────────────────────────────────────────────────────────────────
function formatNum(input) {
  let v = input.value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
  let out = '';
  if (v.length > 0)  out += v.slice(0, 7);
  if (v.length > 7)  out += '-' + v.slice(7, 10);
  if (v.length > 10) out += '-' + v.slice(10, 13);
  input.value = out;
}

function editProject(id) {
  const p = projects.find(x => x.id === id);
  if (!p) return;
  editId = id;
  document.getElementById('modal-title').textContent = 'Edytuj projekt';
  document.getElementById('f-num').value      = p.num    || '';
  document.getElementById('f-name').value     = p.name   || '';
  document.getElementById('f-desc').value     = p.desc   || '';
  document.getElementById('f-status').value   = p.status || 'planned';
  document.getElementById('f-start').value    = p.start  || '';
  document.getElementById('f-end').value      = p.end    || '';
  document.getElementById('f-progress').value = p.progress || 0;
  document.getElementById('btn-delete').style.display = '';
  document.getElementById('modal-bg').classList.add('open');
}
function closeModal() { document.getElementById('modal-bg').classList.remove('open'); }

async function saveProject() {
  const num  = document.getElementById('f-num').value.trim();
  const name = document.getElementById('f-name').value.trim();
  if (!name) { alert('Podaj nazwę projektu'); return; }

  if (editId) {
    const p = projects.find(x => x.id === editId);
    if (!p) return;
    p.num = num; p.name = name;
    p.syncId   = num || name.replace(/\s+/g,'_');
    p.desc     = document.getElementById('f-desc').value.trim();
    p.status   = document.getElementById('f-status').value;
    p.start    = document.getElementById('f-start').value;
    p.end      = document.getElementById('f-end').value;
    p.progress = parseInt(document.getElementById('f-progress').value) || 0;
    await sbUpsert('projekty', { id: p.id, data: p });
  } else {
    const id = Date.now().toString();
    const syncId = num || name.replace(/\s+/g,'_');
    const p = {
      id, syncId, num, name,
      desc:     document.getElementById('f-desc').value.trim(),
      status:   document.getElementById('f-status').value,
      start:    document.getElementById('f-start').value,
      end:      document.getElementById('f-end').value,
      progress: parseInt(document.getElementById('f-progress').value) || 0,
      hasSchedule: false,
    };
    projects.push(p);
    await sbUpsert('projekty', { id: p.id, data: p });
  }
  closeModal();
  renderProjects();
}

async function deleteProject() {
  const _ap=projects.find(x=>x.id===editId); if(!confirm('Czy zarchiwizować projekt „'+((_ap&&_ap.name)||'')+'“?')) return;
  const p = projects.find(x => x.id === editId);
  if (!p) return;
  // Archive: oznacz projekt jako zarchiwizowany w tabeli projekty
  p.archived = true;
  p.archivedAt = new Date().toISOString();
  await sbUpsert('projekty', { id: p.id, data: p });
  projects = projects.filter(x => x.id !== editId);
  closeModal();
  renderProjects();
  showToast('📦 Przeniesiono do archiwum');
  // Otwórz archiwum i odśwież
  const _sec = document.getElementById('archive-section');
  const _con = document.getElementById('archive-container');
  const _ico = document.getElementById('archive-toggle-icon');
  if (_sec && _con) {
    _sec.dataset.open = '1';
    _con.style.display = 'flex';
    if (_ico) _ico.textContent = '▼';
  }
  renderArchive();
}

function loadArchive() {
  return projects.filter(p => p && p.archived);
}

async function restoreProject(id) {
  const arch = loadArchive();
  const p = arch.find(x => x.id === id);
  if (!p) return;
  if (!confirm('Czy przywrócić projekt „'+p.name+'“?')) return;
  delete p.archived;
  delete p.archivedAt;
  projects.push(p);
  await sbUpsert('projekty', { id: p.id, data: p });
  renderProjects();
  showToast('✓ Przywrócono: ' + restored.name);
  renderArchive();
}

async function deleteForever(id) {
  const _fp=(loadArchive()).find(x=>x.id===id); if(!confirm('Czy trwale usuń projekt „'+((_fp&&_fp.name)||'')+'“? Tego nie można cofnąć.')) return;
  const arch = loadArchive();
  const p = arch.find(x => x.id === id);
  if (p) {
    const syncId = p.syncId || p.num || p.name?.replace(/\s+/g,'_');
    if (syncId) await sbDelete('harmonogramy', syncId);
  }
  await sbDelete('projekty', id);
  renderArchive();
  showToast('🗑 Usunięto na zawsze');
}

function renderArchive() {
  const arch = loadArchive();
  const sec = document.getElementById('archive-section');
  const container = document.getElementById('archive-container');
  const badge = document.getElementById('archive-badge');
  if (badge) badge.textContent = arch.length || '';
  if (!sec || !container) return;
  if (!arch.length) {
    container.innerHTML = '<div style="color:var(--g4);font-size:12px;padding:8px 0;font-style:italic">Archiwum jest puste</div>';
    return;
  }
  container.innerHTML = arch.map(p => {
    const archivedDate = p.archivedAt ? new Date(p.archivedAt).toLocaleDateString('pl-PL') : '—';
    return `<div class="archive-card">
      <div class="archive-card-info">
        <div class="archive-card-num">${p.num || '—'}</div>
        <div class="archive-card-name">${p.name}</div>
        <div class="archive-card-date">zarchiwizowano ${archivedDate}</div>
      </div>
      <div class="archive-card-actions">
        <button class="archive-restore-btn" onclick="restoreProject('${p.id}')">↩ Przywróć</button>
        <button class="archive-del-btn" onclick="deleteForever('${p.id}')">✕ Usuń na zawsze</button>
      </div>
    </div>`;
  }).join('');
}

function toggleArchive() {
  const sec = document.getElementById('archive-section');
  if (!sec) return;
  const isOpen = sec.dataset.open === '1';
  sec.dataset.open = isOpen ? '0' : '1';
  document.getElementById('archive-container').style.display = isOpen ? 'none' : 'block';
  document.getElementById('archive-toggle-icon').textContent = isOpen ? '▶' : '▼';
  if (!isOpen) renderArchive();
}

// ── Sync z harmonogramu ──────────────────────────────────────────────────────
async function applySync(payload) {
  if (!payload || !payload.id) return;
  let p = projects.find(x => x.syncId === payload.id || (x.num && x.num === payload.num && payload.num));
  if (p) {
    p.name = payload.name || p.name;
    p.num  = payload.num  || p.num;
    if (payload.start) p.start = payload.start;
    if (payload.end)   p.end   = payload.end;
    p.syncId = payload.id; p.hasSchedule = true; p.lastSynced = payload.savedAt;
    await sbUpsert('projekty', { id: p.id, data: p });
    showToast('✓ Zapisano: ' + p.name);
  } else {
    const id = Date.now().toString();
    p = {
      id, syncId: payload.id, num: payload.num || '', name: payload.name || 'Nowy projekt',
      desc: '', status: 'active', start: payload.start || '', end: payload.end || '',
      progress: 0, hasSchedule: true, lastSynced: payload.savedAt
    };
    projects.push(p);
    await sbUpsert('projekty', { id: p.id, data: p });
    showToast('＋ Dodano: ' + p.name);
  }
  renderProjects();
}

// BroadcastChannel (ta sama przeglądarka)
try { const bc = new BroadcastChannel('pm_sync'); bc.onmessage = e => applySync(e.data); } catch(e) {}

// Realtime Supabase — projekty
sbRealtime('projekty', async () => {
  await loadProjects();
  renderProjects();
});

// Realtime Supabase — harmonogramy (aktualizacja znacznika hasSchedule)
sbRealtime('harmonogramy', async (event, record) => {
  if (!record) return;
  const p = projects.find(x => (x.syncId || x.num) === record.sync_id);
  if (p) { p.hasSchedule = true; renderProjects(); }
});

// ── Aktywność / Tooltip ──────────────────────────────────────────────────────
let _activityCache = {}; // syncId -> {email, ts}
let _activityLog = [];

function editorInitials(email) {
  const name = email.split('@')[0];
  const parts = name.split(/[._-]/);
  if (parts.length >= 2) return (parts[0][0]+parts[1][0]).toUpperCase();
  return name.slice(0,2).toUpperCase();
}

function _timeAgo(ts) {
  const diff = Date.now() - new Date(ts).getTime();
  const m = Math.floor(diff/60000);
  if (m < 1) return 'przed chwilą';
  if (m < 60) return m+'m temu';
  const h = Math.floor(m/60);
  if (h < 24) return h+'h temu';
  const d = Math.floor(h/24);
  return d+'d temu';
}

async function loadActivityLog() {
  try {
    const res = await fetch(`${SB_URL}/rest/v1/activity_log?order=ts.desc&limit=50`, {
      headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${_authToken || SB_KEY}` }
    });
    if (!res.ok) return;
    _activityLog = await res.json();
    // Build cache: latest editor per project
    _activityCache = {};
    for (const row of _activityLog) {
      if (!_activityCache[row.sync_id]) {
        _activityCache[row.sync_id] = { email: row.email, ts: row.ts };
      }
    }
    renderActivitySection();
  } catch(e) {}
}

function renderActivitySection() {
  const sec = document.getElementById('activity-section');
  const list = document.getElementById('activity-list');
  const cnt = document.getElementById('activity-count');
  if (!sec || !list) return;
  if (!_activityLog.length) { sec.style.display = 'none'; return; }
  sec.style.display = 'block';
  cnt.textContent = _activityLog.length + ' zmian';
  list.innerHTML = _activityLog.slice(0,20).map(row => `
    <div class="activity-row">
      <div class="act-dot" style="background:${presenceColor(row.email)}">${editorInitials(row.email)}</div>
      <div class="act-info">
        <div class="act-project">${row.project_name || row.sync_id}</div>
        <div class="act-email">${row.email}</div>
      </div>
      <div class="act-time">${new Date(row.ts).toLocaleString('pl-PL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</div>
    </div>`).join('') || '<div class="activity-empty">Brak historii zmian</div>';
}

// ── Phase Tooltip ────────────────────────────────────────────────────────────
function showPhaseTooltip(e, projectId) {
  const p = projects.find(x => x.id === projectId);
  if (!p || !p.phaseSummary || !p.phaseSummary.length) return;
  const tip = document.getElementById('phase-tooltip');
  if (!tip) return;
  const phases = p.phaseSummary.filter(ph => ph.start || ph.end);
  if (!phases.length) return;
  tip.innerHTML = `<div class="pt-title">Główne terminy</div>` +
    phases.map(ph => {
      const dates = ph.start && ph.end
        ? ph.start.slice(0,7) + ' → ' + ph.end.slice(0,7)
        : (ph.start || ph.end || '').slice(0,7);
      return `<div class="pt-row">
        <div class="pt-dot" style="background:${ph.color}"></div>
        <div class="pt-label">${ph.label}</div>
        <div class="pt-dates">${dates}</div>
      </div>`;
    }).join('');
  tip.classList.add('visible');
  _posTooltip(e);
}

function hidePhaseTooltip() {
  const tip = document.getElementById('phase-tooltip');
  if (tip) tip.classList.remove('visible');
}

function movePhaseTooltip(e) {
  _posTooltip(e);
}

function _posTooltip(e) {
  const tip = document.getElementById('phase-tooltip');
  if (!tip) return;
  const x = e.clientX + 16;
  const y = e.clientY + 16;
  const tw = tip.offsetWidth || 240;
  const th = tip.offsetHeight || 160;
  tip.style.left = (x + tw > window.innerWidth - 8 ? e.clientX - tw - 8 : x) + 'px';
  tip.style.top  = (y + th > window.innerHeight - 8 ? e.clientY - th - 8 : y) + 'px';
}

// ── Toast ────────────────────────────────────────────────────────────────────
function showToast(msg) {
  let t = document.getElementById('pm-toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'pm-toast';
    t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0a0a0a;color:#fff;font-family:Barlow,sans-serif;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:10px 20px;box-shadow:0 4px 16px rgba(0,0,0,.25);z-index:999;transition:opacity .3s;opacity:0;pointer-events:none;white-space:nowrap';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._hide);
  t._hide = setTimeout(() => { t.style.opacity = '0'; }, 3500);
}

// ── Presence ─────────────────────────────────────────────────────────────────
const PRESENCE_COLORS = ['#e74c3c','#3498db','#2ecc71','#f39c12','#9b59b6','#1abc9c','#e67e22','#e91e63'];
function presenceColor(email) {
  let h = 0; for (let i = 0; i < email.length; i++) h = (h * 31 + email.charCodeAt(i)) & 0xffffffff;
  return PRESENCE_COLORS[Math.abs(h) % PRESENCE_COLORS.length];
}
function presenceInitials(email) {
  const name = email.split('@')[0];
  const parts = name.split(/[._-]/);
  if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
  return name.slice(0, 2).toUpperCase();
}

let _myPresenceId = null;

function startPresence(location) {
  if (!_authUser) return;
  const email = _authUser.email;
  _myPresenceId = email.replace(/[^a-z0-9]/gi,'_') + '_' + location;

  async function heartbeat() {
    try {
      await fetch(`${SB_URL}/rest/v1/presence`, {
        method: 'POST',
        headers: { ...sbHeaders(), 'Prefer': 'resolution=merge-duplicates' },
        body: JSON.stringify({ id: _myPresenceId, email, location, updated_at: new Date().toISOString() })
      });
    } catch(e) {}
  }

  async function poll() {
    try {
      const cutoff = new Date(Date.now() - 30000).toISOString();
      await fetch(`${SB_URL}/rest/v1/presence?location=eq.${encodeURIComponent(location)}&updated_at=lt.${encodeURIComponent(cutoff)}`, {
        method: 'DELETE', headers: sbHeaders()
      });
      const res = await fetch(`${SB_URL}/rest/v1/presence?location=eq.${encodeURIComponent(location)}&select=email`, {
        headers: sbHeaders()
      });
      if (!res.ok) return;
      const rows = await res.json();
      const others = rows.filter(r => r.email !== email).map(r => r.email);
      renderPresence(others);
    } catch(e) {}
  }

  heartbeat();
  setInterval(heartbeat, 15000);
  poll();
  setInterval(poll, 10000);
  window.addEventListener('beforeunload', () => {
    fetch(`${SB_URL}/rest/v1/presence?id=eq.${encodeURIComponent(_myPresenceId)}`, {
      method: 'DELETE', headers: sbHeaders(), keepalive: true
    });
  });
}

function renderPresence(others) {
  const bar = document.getElementById('presence-bar');
  if (!bar) return;
  if (!others || !others.length) { bar.innerHTML = ''; return; }
  bar.innerHTML = others.map((email, i) => `
    <div title="${email}" style="width:28px;height:28px;border-radius:50%;background:${presenceColor(email)};
      display:flex;align-items:center;justify-content:center;font-family:'Barlow',sans-serif;
      font-size:10px;font-weight:700;color:#fff;cursor:default;
      border:2px solid rgba(255,255,255,.25);margin-right:${i < others.length-1 ? '-6px' : '0'};
      z-index:${others.length-i};position:relative">${presenceInitials(email)}</div>
  `).join('');
}

// ── Reset hasła ───────────────────────────────────────────────────────────────
function openForgotPassword() {
  document.getElementById('forgot-email').value = document.getElementById('login-email').value || '';
  document.getElementById('forgot-msg').style.display = 'none';
  document.getElementById('forgot-modal').style.display = 'flex';
}
function closeForgotPassword() {
  document.getElementById('forgot-modal').style.display = 'none';
}
async function doForgotPassword() {
  const email = document.getElementById('forgot-email').value.trim();
  const btn   = document.getElementById('forgot-btn');
  const msg   = document.getElementById('forgot-msg');
  if (!email) { msg.textContent = 'Wpisz adres email'; msg.style.color = '#c0392b'; msg.style.display = 'block'; return; }
  btn.textContent = 'Wysyłanie…'; btn.disabled = true;
  try {
    const res = await fetch(`${SB_URL}/auth/v1/recover`, {
      method: 'POST',
      headers: { 'apikey': SB_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email }),
    });
    msg.textContent = 'Link do resetowania hasła został wysłany na podany adres email.';
    msg.style.color = '#27ae60';
    msg.style.display = 'block';
    btn.textContent = 'Wysłano ✓';
  } catch(e) {
    msg.textContent = 'Błąd wysyłania. Spróbuj ponownie.';
    msg.style.color = '#c0392b';
    msg.style.display = 'block';
    btn.textContent = 'Wyślij link'; btn.disabled = false;
  }
}

// ── Zmiana hasła ─────────────────────────────────────────────────────────────
function openChangePassword() {
  document.getElementById('new-password').value  = '';
  document.getElementById('new-password2').value = '';
  document.getElementById('change-pwd-msg').style.display = 'none';
  document.getElementById('change-pwd-btn').textContent = 'Zapisz';
  document.getElementById('change-pwd-btn').disabled = false;
  document.getElementById('change-pwd-modal').style.display = 'flex';
}
function closeChangePassword() {
  document.getElementById('change-pwd-modal').style.display = 'none';
}
async function doChangePassword() {
  const p1  = document.getElementById('new-password').value;
  const p2  = document.getElementById('new-password2').value;
  const btn = document.getElementById('change-pwd-btn');
  const msg = document.getElementById('change-pwd-msg');
  if (!p1) { msg.textContent = 'Wpisz nowe hasło'; msg.style.color = '#c0392b'; msg.style.display = 'block'; return; }
  if (p1 !== p2) { msg.textContent = 'Hasła nie są identyczne'; msg.style.color = '#c0392b'; msg.style.display = 'block'; return; }
  if (p1.length < 6) { msg.textContent = 'Hasło musi mieć minimum 6 znaków'; msg.style.color = '#c0392b'; msg.style.display = 'block'; return; }
  btn.textContent = 'Zapisywanie…'; btn.disabled = true;
  try {
    const res = await fetch(`${SB_URL}/auth/v1/user`, {
      method: 'PUT',
      headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${_authToken}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: p1 }),
    });
    if (!res.ok) throw new Error('Błąd zmiany hasła');
    msg.textContent = 'Hasło zostało zmienione.';
    msg.style.color = '#27ae60';
    msg.style.display = 'block';
    btn.textContent = 'Zapisano ✓';
    setTimeout(() => closeChangePassword(), 2000);
  } catch(e) {
    msg.textContent = e.message;
    msg.style.color = '#c0392b';
    msg.style.display = 'block';
    btn.textContent = 'Zapisz'; btn.disabled = false;
  }
}

// ── Login ─────────────────────────────────────────────────────────────────────
function showLoginScreen() {
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('user-info').style.display = 'none';
}

function hideLoginScreen() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('user-info').style.display = 'flex';
  document.getElementById('user-email').textContent = _authUser?.email || '';
}

async function doLogin() {
  const email    = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const btn      = document.getElementById('login-btn');
  const err      = document.getElementById('login-error');
  if (!email || !password) { err.textContent = 'Wpisz email i hasło'; err.style.display = 'block'; return; }
  btn.textContent = 'Logowanie…'; btn.disabled = true; err.style.display = 'none';
  try {
    await sbSignIn(email, password);
    hideLoginScreen();
    await loadProjects();
    await loadActivityLog();
    renderProjects();
    startPresence('panel');
    sbRealtime('projekty', async () => { await loadProjects(); renderProjects(); });
    sbRealtime('activity_log', async () => { await loadActivityLog(); renderProjects(); });
    sbRealtime('harmonogramy', async (event, record) => {
      if (!record) return;
      const p = projects.find(x => (x.syncId || x.num) === record.sync_id);
      if (p) { p.hasSchedule = true; renderProjects(); }
    });
  } catch(e) {
    err.textContent = e.message; err.style.display = 'block';
    btn.textContent = 'Zaloguj'; btn.disabled = false;
  }
}

// ── Init ─────────────────────────────────────────────────────────────────────
(async () => {
  // Sprawdź czy jest zapisany token z poprzedniej sesji
  const saved = sessionStorage.getItem('sb_token');
  const savedUser = sessionStorage.getItem('sb_user');
  if (saved) {
    _authToken = saved;
    try { _authUser = JSON.parse(savedUser); } catch(e) {}
    try {
      await loadProjects();
      await loadActivityLog();
      hideLoginScreen();
      renderProjects();
      startPresence('panel');
      // Uruchom realtime
      sbRealtime('projekty', async () => { await loadProjects(); renderProjects(); });
      sbRealtime('activity_log', async () => { await loadActivityLog(); renderProjects(); });
      sbRealtime('harmonogramy', async (event, record) => {
        if (!record) return;
        const p = projects.find(x => (x.syncId || x.num) === record.sync_id);
        if (p) { p.hasSchedule = true; renderProjects(); }
      });
    } catch(e) {
      // Token wygasł
      showLoginScreen();
    }
  } else {
    showLoginScreen();
  }
})();
